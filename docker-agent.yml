agents:
  root:
    model: mistral/ministral-3b-latest
    description: Repo agent — implements features via PR
    instruction: |
      Work only inside the mounted repository. For every task:
      1. Pull the repo and create a new branch off main.
        - Branch should start with the prefix "agent-" and a short name for the feature.
      2. Implement the requested change.
      3. Commit with a clear message.
      4. Push the branch and open a pull request against main.
      Never push directly to main.
    permissions:
      deny: # even with --yolo flag
        - "shell:cmd=git push*--force*"
        - "shell:cmd=git push*:main"
        - "shell:cmd=git clean -fd*"
        - "shell:cmd=rm *"
        - "shell:cmd=sudo*"
        - "shell:cmd=chmod *"
        - "shell:cmd=sh *"
        - "shell:cmd=bash *"
        - "shell:cmd=zsh *"
    toolsets:
      - type: filesystem
      - type: shell
      - type: think
      - type: mcp
        ref: docker:github-official
        defer: true # load on demand
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: $GITHUB_PERSONAL_ACCESS_TOKEN
