# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/docker-agent/main/agent-schema.json
version: "15"

agents:
  root:
    model: mistral/mistral-medium-latest
    description: Repo agent — implements features via PR
    instruction: |
      Work only inside the mounted repository.

      Workflow for every task:
        1. git checkout main && git pull, then git checkout -b agent/<short-feature-name>.
           (Enforced: writes and non-git shell commands are refused until you're off
           main — if a call fails for this reason, branch first and retry.)
        2. Implement the requested change.
        3. Commit with a clear message.
        4. Push the branch and open a pull request against main. Never push to main directly.


      Branch discipline (MANDATORY, before any other work):
      - Your FIRST actions on every task are, in order:
        git checkout main && git pull, then
        git checkout -b agent/<short-feature-name>.
      - Do not create, edit, or write ANY file until you are on the new branch.
      - Before your first commit, run git branch --show-current and confirm
        you are NOT on main. If you are on main, create the branch first.
      - This is enforced: writes and non-git shell commands are blocked
        while you are on main, so if a call fails for this reason, branch
        first and retry.

      Dependency policy:
      - Do not install dependencies, or run builds/tests that require them.
        (Enforced: install invocations are refused regardless of how they're phrased.)
      - Instead, declare dependencies in the project's manifest files exactly as the
        target ecosystem expects, and write source code against them.
      - In the PR description, include a "How to verify" section stating the exact
        commands a human must run to install and verify the change.
      - If a task cannot be completed without an install or build step, stop, commit
        what is complete, and state in the PR description exactly which step is
        blocked and why.

    toolsets:
      - type: filesystem
      - type: shell
      - type: think
      - type: mcp
        ref: docker:github-official
        defer: true
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: $GITHUB_PERSONAL_ACCESS_TOKEN

    hooks:
      pre_tool_use:
        - matcher: "shell|edit_file|write_file|create_directory"
          preempt_yolo: true
          hooks:
            - type: command
              command: "/app/hooks/enforce-policy.sh"
              timeout: 10

permissions:
  deny:
    - "shell:cmd=rm*"
    - "shell:cmd=sudo*"
    - "shell:cmd=mv*"
    - "shell:cmd=chmod*"
    - "shell:cmd=chown*"
    - "shell:cmd=sh *"
    - "shell:cmd=bash *"
    - "shell:cmd=zsh *"
    - "shell:cmd=git push*--force*"
    - "shell:cmd=git push*:main"
    - "shell:cmd=git clean -fd*"
    - "github_delete_*"
    - "github_close_*"
    - "shell:cmd=npm install*"
    - "shell:cmd=npm i *"
    - "shell:cmd=npm ci*"
    - "shell:cmd=npx*"
    - "shell:cmd=yarn *"
    - "shell:cmd=pnpm *"
    - "shell:cmd=pip install*"
    - "shell:cmd=pip3 install*"
    - "shell:cmd=poetry *"
    - "shell:cmd=uv *"
  allow:
    - "shell:cmd=ls*"
    - "shell:cmd=cat*"
    - "shell:cmd=grep*"
    - "shell:cmd=find*"
    - "shell:cmd=head*"
    - "shell:cmd=tail*"
    - "shell:cmd=wc*"
    - "write_file:path=/workspace/*"
    - "edit_file:path=/workspace/*"
    - "create_directory:path=/workspace/*"
