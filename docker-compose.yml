services:
  # Forward proxy: the ONLY thing standing between the agent and the internet.
  # Domain allow-listing lives in squid.conf.
  proxy:
    image: ubuntu/squid:latest
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks: # bridges the isolated agent network to the real one
      egress:
        ipv4_address: 172.28.1.2 # static — sidesteps DNS entirely
      internet: {}

  agent:
    build: .
    runtime: "runsc" # gVisor: extra syscall-interception layer around this container
    user: "1000:1000" # non-root inside the container
    working_dir: /workspace
    volumes:
      - ${REPO_PATH}:/workspace:rw
      - agent-config:/home/agent/.config
      - agent-state:/home/agent/.cagent
    env_file: .env
    environment:
      HTTPS_PROXY: http://172.28.1.2:3128 # force all HTTPS traffic through squid
      HTTP_PROXY: http://172.28.1.2:3128
      NO_PROXY: localhost,127.0.0.1
    mem_limit: 4g # hard memory cap
    cpus: "4.0" # hard CPU cap
    read_only: true # root filesystem is immutable
    tmpfs: [/tmp] # except a scratch dir, wiped on restart
    networks: [egress] # this network has NO direct route to the internet
    command: ["run", "docker-agent.yml"] # Add --yolo?
    depends_on: [proxy]

networks:
  egress:
    internal: true # no external route at all — only reachable via proxy container
    ipam:
      config:
        - subnet: 172.28.1.0/24
  internet:
    driver: bridge # proxy's actual route out

volumes:
  agent-config:
  agent-state:
